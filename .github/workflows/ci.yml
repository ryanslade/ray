name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - run: go build ./...
      - run: go test -race ./...

  go-simd:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: go
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  ocaml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocaml
    steps:
      - uses: actions/checkout@v7
      # setup-ocaml caches the compiler but not the packages, so every run
      # spent over a minute updating opam and building dune and alcotest.
      # This caches the whole switch instead, keyed on the dependencies, and
      # uses it without opam when it's there.
      - id: cache
        uses: actions/cache@v6
        with:
          path: _opam
          key: ocaml-5.5-${{ hashFiles('ocaml/*.opam') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test
      - run: echo "$GITHUB_WORKSPACE/_opam/bin" >> "$GITHUB_PATH"
      - run: dune build
      - run: dune test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  zig:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zig
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check .
      - run: zig build
      - run: zig build test
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: zig build bench -- 1 1

  c:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c
    env:
      CFLAGS: -O3 -flto -Werror
    steps:
      - uses: actions/checkout@v7
      - run: make format-check
      - run: make build
      - run: make test
      - run: make test SANITIZE=address,undefined CFLAGS="-O1 -Werror"
      # ThreadSanitizer can't map its shadow memory with the kernel's default
      # amount of address space randomisation.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: make test SANITIZE=thread CFLAGS="-O1 -Werror"
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: make bench ARGS="1 1"

  janet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: janet
    steps:
      - uses: actions/checkout@v7
      - name: Install Janet
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL https://github.com/janet-lang/janet/archive/refs/tags/v1.41.2.tar.gz | tar xz
          make -C janet-1.41.2 -j"$(nproc)"
          sudo make -C janet-1.41.2 install
      # The same as jpm test, without needing jpm.
      - run: for t in test/*.janet; do janet "$t"; done

  clojure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clojure
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ hashFiles('clojure/deps.edn') }}
      - run: clojure -M:fmt check
      - run: clojure -M:lint
      - run: clojure -M:test
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: clojure -M:bench 1 1

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Validates the wrapper and caches Gradle's downloads.
      - uses: gradle/actions/setup-gradle@v6
      # Runs ktlint and the tests, with compiler warnings as errors.
      - run: ./gradlew build
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: ./gradlew bench --args="1 1"

  scala:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala
    steps:
      - uses: actions/checkout@v7
      # Mill, the JDK it downloads and the dependencies.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: scala-${{ hashFiles('scala/build.mill') }}
      - run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll
      # Runs the tests, with compiler warnings as errors.
      - run: ./mill test
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: ./mill bench 1 1

  common-lisp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common-lisp
    steps:
      - uses: actions/checkout@v7
      - name: Install SBCL
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.9/sbcl-2.6.9-x86-64-linux-binary.tar.bz2 | tar xj
          cd sbcl-2.6.9-x86-64-linux && sudo sh install.sh
      # Runs the tests, with compiler warnings (including style warnings) as
      # errors.
      - run: make test
      - run: make build
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: make bench ARGS="1 1"

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix format --check-formatted
      # Runs the tests, with compiler warnings as errors.
      - run: mix test --warnings-as-errors
      - run: mix escript.build
      # Checks the benchmark builds and runs (one iteration in one process).
      - run: mix bench 1 1

  racket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: racket
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: "9.3"
          distribution: minimal
          packages: rackunit-lib, compiler-lib
      - run: make test
      - run: make build
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: make bench ARGS="1 1"

  metal:
    runs-on: macos-15
    defaults:
      run:
        working-directory: metal
    steps:
      - uses: actions/checkout@v7
      - run: swift format lint --strict --recursive Package.swift Sources Tests
      - run: brew install clang-format
      - run: clang-format --dry-run --Werror Sources/Raytracer/Shaders.metal
      - run: swift build
      - run: swift test
      # Checks the benchmark builds and runs (one iteration).
      - run: swift run -c release bench 1
