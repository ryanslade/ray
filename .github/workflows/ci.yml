name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - run: go build ./...
      - run: go test -race ./...

  go-simd:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: go
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go/go.mod
      - run: go vet ./...
      # TestRenderWorld's golden image was encoded by Go 1.25's image/jpeg,
      # whose output changed in Go 1.27.
      - run: go test -race -run TestHitSpheresMatchesScalar ./...

  ocaml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocaml
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  zig:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zig
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check .
      - run: zig build
      - run: zig build test
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: zig build bench -- 1 1

  c:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c
    env:
      CFLAGS: -O3 -flto -Werror
    steps:
      - uses: actions/checkout@v7
      - run: make format-check
      - run: make
      - run: make test
      - run: make test SANITIZE=address,undefined CFLAGS="-O1 -Werror"
      # ThreadSanitizer can't map its shadow memory with the kernel's default
      # amount of address space randomisation.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: make test SANITIZE=thread CFLAGS="-O1 -Werror"
      # Checks the benchmark builds and runs (one iteration on one thread).
      - run: make bench ARGS="1 1"

  janet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: janet
    steps:
      - uses: actions/checkout@v7
      - name: Install Janet
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL https://github.com/janet-lang/janet/archive/refs/tags/v1.41.2.tar.gz | tar xz
          make -C janet-1.41.2 -j"$(nproc)"
          sudo make -C janet-1.41.2 install
      # The same as jpm test, without needing jpm.
      - run: for t in test/*.janet; do janet "$t"; done
